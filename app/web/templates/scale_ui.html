<!doctype html>
<html>
<head>
  <title>VerdureAI Scale</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #10241a;
      color: #eafff0;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }
    #phase { font-size: 1.5rem; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.8; }
    #weight { font-size: 4rem; font-weight: bold; }
    #result { text-align: center; max-width: 32rem; }
    #result img { max-width: 220px; margin-top: 1rem; }
    .item-name { font-size: 1.75rem; margin: 0.25rem 0; }
    .price-row { font-size: 1.25rem; }
    .strike { text-decoration: line-through; opacity: 0.6; margin-right: 0.5rem; }
    .final { font-size: 2rem; font-weight: bold; color: #7CFC9C; }
    .reject { color: #ff8a80; font-size: 1.25rem; }
    .code { font-family: monospace; font-size: 1.5rem; letter-spacing: 0.2em; margin-top: 0.5rem; }
    .detail { opacity: 0.7; font-size: 0.9rem; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div id="phase">Waiting for item</div>
  <div id="weight">0 g</div>
  <div id="result"></div>

  <script>
    async function poll() {
      try {
        const res = await fetch("/state");
        const state = await res.json();
        render(state);
      } catch (e) {
        // transient fetch failure -- next poll will retry
      } finally {
        setTimeout(poll, 300);
      }
    }

    function render(state) {
      document.getElementById("phase").textContent = {
        idle: "Waiting for item",
        weighing: "Weighing...",
        scanning: "Scanning...",
        result: "Result",
      }[state.phase] || state.phase;
      document.getElementById("weight").textContent = `${Math.round(state.weight_grams)} g`;

      const resultEl = document.getElementById("result");
      if (state.phase !== "result" || !state.result) {
        resultEl.innerHTML = "";
        return;
      }

      const r = state.result;
      if (!r.for_sale) {
        resultEl.innerHTML = `
          <p class="item-name">${r.item_name}</p>
          <p class="reject">Not for sale -- ${r.detail}</p>
        `;
        return;
      }

      resultEl.innerHTML = `
        <p class="item-name">${r.item_name}</p>
        <p class="price-row">
          <span class="strike">$${r.base_price.toFixed(2)}</span>
          <span>${r.discount_pct}% off</span>
        </p>
        <p class="final">$${r.final_price.toFixed(2)}</p>
        ${r.qr_data_uri ? `<img src="${r.qr_data_uri}" alt="Discount QR code">` : ""}
        <p class="code">${r.discount_code || ""}</p>
        <p class="detail">${r.detail}</p>
      `;
    }

    poll();
  </script>
</body>
</html>
